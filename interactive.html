<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寵物用品博覽會 - 互動展位平面圖與動線導航</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Google Fonts: Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', 'system-ui', 'sans-serif'],
          },
          colors: {
            expo: {
              cream: '#faf6ee',
              border: '#3b3834',
              food: '#f59e42',
              grooming: '#6ec5cb',
              toys: '#f4df40',
              furniture: '#bb9ec8',
              outdoor: '#80bf69',
              scratch: '#ee836f',
              stage: '#fbf4ea',
              play: '#b8deb3',
              grass: '#489f3b',
              water: '#3ea8d8',
              vet: '#d33838'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* 展覽原圖暖米色底色調 */
    body {
      background-color: #f7f3eb;
    }

    /* 導航流光動畫線條 */
    @keyframes navFlow {
      from {
        stroke-dashoffset: 60;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    .nav-active-path {
      stroke-dasharray: 8 6;
      animation: navFlow 1.2s linear infinite;
    }

    .tour-flow-line {
      stroke-dasharray: 6 5;
      animation: navFlow 2.4s linear infinite;
    }

    /* 點擊展區亮光動畫 */
    @keyframes pulseGlow {
      0%, 100% {
        filter: drop-shadow(0 0 4px rgba(234, 88, 12, 0.4));
        stroke-width: 2.5px;
      }
      50% {
        filter: drop-shadow(0 0 16px rgba(220, 38, 38, 0.9)) drop-shadow(0 0 8px rgba(249, 115, 22, 0.9));
        stroke-width: 4.5px;
      }
    }

    .active-zone-glow {
      animation: pulseGlow 1.5s infinite ease-in-out !important;
      stroke: #d946ef !important;
    }

    /* SVG 展位滑鼠懸停效果 */
    .interactive-booth {
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .interactive-booth:hover {
      filter: brightness(1.08) drop-shadow(0 3px 6px rgba(0,0,0,0.2));
    }

    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1ebd9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cfc2a8;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #b8a687;
    }
  </style>
</head>
<body class="text-slate-800 h-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- 頂部導航欄 (Header) -->
  <header class="h-14 md:h-16 bg-white/95 backdrop-blur border-b border-amber-900/10 px-4 md:px-6 flex items-center justify-between shrink-0 z-30 shadow-xs">
    <div class="flex items-center gap-3">
      <button id="toggle-sidebar-btn" class="p-2 rounded-xl border border-stone-200 text-stone-600 hover:bg-stone-50 transition lg:hidden" title="切換選單">
        <i class="ph-bold ph-list text-lg"></i>
      </button>
      <div class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-amber-500 text-white flex items-center justify-center shadow-md shadow-amber-500/25">
        <i class="ph-fill ph-paw-print text-xl"></i>
      </div>
      <div>
        <h1 class="text-sm md:text-lg font-black tracking-wider text-stone-900 flex items-center gap-2">
          寵物用品博覽會 展位平面圖
          <span class="text-[10px] md:text-xs font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 hidden sm:inline-block">
            無遮擋互動導覽
          </span>
        </h1>
        <p class="text-[11px] text-stone-500 hidden sm:block">點擊任一展位，地圖自動居中對焦並規劃「從入口出發」的專屬動線</p>
      </div>
    </div>

    <!-- 頂部操作按鈕群 -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- 專注地圖全景模式按鈕 -->
      <button id="focus-mode-btn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-stone-300 bg-white hover:bg-stone-100 text-stone-700 text-xs sm:text-sm font-semibold transition active:scale-95 shadow-xs" title="隱藏兩側面板，完全展現地圖">
        <i class="ph-bold ph-eye text-stone-700" id="focus-mode-icon"></i>
        <span id="focus-mode-text">全地圖模式</span>
      </button>

      <!-- 推薦順時針全場動線開關 -->
      <button id="toggle-tour-btn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-stone-300 bg-stone-50 hover:bg-stone-100 text-stone-700 text-xs sm:text-sm font-semibold transition active:scale-95 shadow-xs">
        <i class="ph-bold ph-compass text-amber-600"></i>
        <span class="hidden sm:inline">建議環線</span>
        <span id="tour-dot" class="w-2 h-2 rounded-full bg-stone-300"></span>
      </button>

      <!-- 清除導航動線 -->
      <button id="clear-route-btn" class="hidden md:flex items-center gap-1 px-3 py-1.5 rounded-xl border border-stone-200 bg-white hover:bg-stone-50 text-stone-600 text-xs font-medium transition active:scale-95">
        <i class="ph-bold ph-arrow-counter-clockwise"></i>
        <span>重設</span>
      </button>
    </div>
  </header>

  <!-- 主內容視窗：完全解耦的三欄佈局 (左選單 + 中間地圖 + 右資訊面板) -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- 左側面板 (展區清單與篩選 Tab) -->
    <aside id="sidebar" class="w-72 lg:w-80 bg-white border-r border-stone-200 flex flex-col shrink-0 z-20 shadow-md transition-all duration-300 ease-in-out">
      
      <!-- 篩選列 -->
      <div class="p-3 border-b border-stone-100 bg-[#fdfbf7]">
        <div class="text-[11px] font-bold text-stone-400 uppercase tracking-wider mb-2">展會分區快捷索引</div>
        <div class="grid grid-cols-2 gap-1.5" id="zone-quick-filter">
          <button data-cat="all" class="quick-filter-btn active py-1.5 px-2 rounded-lg text-xs font-bold bg-stone-800 text-white transition text-center truncate">全部展區 (12)</button>
          <button data-cat="supplies" class="quick-filter-btn py-1.5 px-2 rounded-lg text-xs font-medium bg-stone-100 text-stone-700 hover:bg-stone-200 transition text-center truncate">寵物生活用品</button>
          <button data-cat="stage" class="quick-filter-btn py-1.5 px-2 rounded-lg text-xs font-medium bg-stone-100 text-stone-700 hover:bg-stone-200 transition text-center truncate">活動舞台與遊樂</button>
          <button data-cat="service" class="quick-filter-btn py-1.5 px-2 rounded-lg text-xs font-medium bg-stone-100 text-stone-700 hover:bg-stone-200 transition text-center truncate">公共與健康服務</button>
        </div>
      </div>

      <!-- 展區卡片清單 -->
      <div id="zone-card-list" class="flex-1 overflow-y-auto p-3 space-y-2.5">
        <!-- 由 JavaScript 動態生成展區卡片 -->
      </div>

      <!-- 底部起點說明提示條 -->
      <div class="p-3 bg-amber-50 border-t border-amber-100 flex items-center justify-between text-xs text-amber-900">
        <div class="flex items-center gap-1.5 font-medium">
          <i class="ph-fill ph-navigation-arrow text-amber-600 text-sm"></i>
          <span>導航起點：正門入口與售票處</span>
        </div>
        <span class="text-[10px] text-amber-700 font-bold px-1.5 py-0.5 rounded bg-amber-200/60">實時指引</span>
      </div>
    </aside>

    <!-- 中央地圖畫布容器 (彈性自適應寬度，絕不被覆蓋) -->
    <main class="flex-1 h-full relative overflow-hidden bg-[#faf6ee] flex items-center justify-center p-2" id="canvas-container">
      
      <!-- 浮動地圖控制器 (縮放/重設) -->
      <div class="absolute left-4 bottom-5 z-20 flex flex-col gap-1.5 bg-white/95 backdrop-blur p-1 rounded-2xl shadow-lg border border-stone-200">
        <button id="zoom-in" class="w-9 h-9 rounded-xl hover:bg-stone-100 flex items-center justify-center text-stone-700 active:scale-95 transition" title="放大地圖">
          <i class="ph-bold ph-plus text-base"></i>
        </button>
        <button id="zoom-out" class="w-9 h-9 rounded-xl hover:bg-stone-100 flex items-center justify-center text-stone-700 active:scale-95 transition" title="縮小地圖">
          <i class="ph-bold ph-minus text-base"></i>
        </button>
        <button id="zoom-reset" class="w-9 h-9 rounded-xl hover:bg-stone-100 flex items-center justify-center text-stone-700 active:scale-95 transition" title="重設視角">
          <i class="ph-bold ph-arrows-out-simple text-base"></i>
        </button>
      </div>

      <!-- 地圖包裝層 (支援 Zoom / Pan) -->
      <div id="map-pan-zoom" class="w-full h-full flex items-center justify-center origin-center transition-transform duration-300 ease-out">
        
        <!-- ==================== 精準還原展位平面圖 SVG (1100 x 780 比例) ==================== -->
        <svg id="expo-svg" viewBox="0 0 1100 780" class="w-full h-full max-h-[92vh] drop-shadow-xl select-none" xmlns="http://www.w3.org/2000/svg">

            <filter id="booth-shadow" x="-5%" y="-5%" width="115%" height="115%">

            </filter>
            <!-- 入口起點漣漪漸層 -->
            <radialGradient id="pin-glow" cx="50%" cy="50%" r="50%">

              <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>

          <line x1="105" y1="70" x2="105" y2="135" stroke="#332f2b" stroke-width="2.5"/>
          <line x1="165" y1="70" x2="165" y2="135" stroke="#332f2b" stroke-width="2.5"/>
          <line x1="225" y1="70" x2="225" y2="135" stroke="#332f2b" stroke-width="2.5"/>
          <line x1="435" y1="70" x2="435" y2="135" stroke="#332f2b" stroke-width="2.5"/>
          <line x1="555" y1="70" x2="555" y2="135" stroke="#332f2b" stroke-width="2.5"/>

            <!-- 右化妝室與逃生口 -->
            <text x="610" y="100">Emergency</text>
            <text x="610" y="114">Exit</text>
            <text x="692" y="105" font-size="11">化妝室</text>
            <circle cx="740" cy="88" r="3" fill="#ec4899"/>
            <circle cx="755" cy="88" r="3" fill="#3b82f6"/>
            <text x="748" y="115">Restrooms</text>

          <!-- 頂部門口門扇開口 (SVG 折線示意) -->
          <path d="M 320 135 L 340 120 M 360 135 L 340 120" stroke="#332f2b" stroke-width="1.8" fill="none"/>
          <path d="M 445 135 L 460 120 M 475 135 L 460 120" stroke="#332f2b" stroke-width="1.8" fill="none"/>
          <path d="M 565 135 L 580 120 M 595 135 L 580 120" stroke="#332f2b" stroke-width="1.8" fill="none"/>
          <path d="M 670 135 L 685 120 M 700 135 L 685 120" stroke="#332f2b" stroke-width="1.8" fill="none"/>

          <!-- 底部入口處結構 (驗票閘門與服務台) -->
          <g>
            <rect x="40" y="640" width="230" height="60" fill="#e7e2d6" stroke="#332f2b" stroke-width="3"/>
            <rect x="270" y="640" width="130" height="60" fill="#dfdacb" stroke="#332f2b" stroke-width="3"/>
            <!-- 詢問台 -->
            <rect x="360" y="625" width="40" height="20" fill="#ca9e6f" stroke="#332f2b" stroke-width="2" rx="3"/>
            <circle cx="380" cy="615" r="7" fill="#0284c7"/>

            <!-- 旋轉閘門圖示 -->
            <rect x="400" y="640" width="160" height="60" fill="#faf7f0" stroke="#332f2b" stroke-width="3"/>
            <path d="M 420 685 L 420 698 M 440 685 L 440 698 M 460 685 L 460 698 M 480 685 L 480 698 M 500 685 L 500 698 M 520 685 L 520 698 M 540 685 L 540 698" stroke="#332f2b" stroke-width="2"/>
            <!-- 閘門扇型開口 -->
            <path d="M 475 640 L 490 660 M 525 640 L 510 660" stroke="#ef4444" stroke-width="2.5" fill="none"/>

            <rect x="560" y="640" width="320" height="60" fill="#e7e2d6" stroke="#332f2b" stroke-width="3"/>
          </g>

          <!-- ==================== 1. 寵物食品與餵食區 (橙色 A01-A19) ==================== -->
          <g id="zone-food" class="interactive-booth" data-id="food" filter="url(#booth-shadow)">
            <!-- 背景範圍高亮感應盒 -->
            <rect x="48" y="150" width="225" height="480" rx="8" fill="#fdebd2" stroke="#f59e42" stroke-width="2.5"/>
            
            <!-- 攤位群 A 左列 (A01, A02...) -->
            <g fill="#f7a750" stroke="#332f2b" stroke-width="1.8" rx="3">

              <rect x="52" y="208" width="24" height="42"/>

            <!-- 攤位群 中間大島嶼攤位 -->

              <!-- 第二排 -->
              <rect x="94" y="275" width="44" height="65"/>

              <rect x="228" y="275" width="20" height="28"/>

              <rect x="228" y="310" width="20" height="28"/>

              <!-- 第三排 -->
              <rect x="94" y="395" width="44" height="65"/>
              <rect x="148" y="395" width="44" height="65"/>
              <rect x="204" y="395" width="20" height="28"/>

              <rect x="204" y="430" width="20" height="28"/>

              <!-- 第四排 (底部長條大展位) -->
              <rect x="94" y="515" width="44" height="90"/>
              <rect x="148" y="515" width="44" height="90"/>
              <rect x="204" y="515" width="20" height="42"/>
              <rect x="228" y="515" width="20" height="42"/>
              <rect x="204" y="563" width="44" height="42"/>
            </g>

            <!-- 底部附屬攤位 (A01, A02, A16) -->
            <rect x="100" y="645" width="30" height="30" fill="#f59e42" stroke="#332f2b" stroke-width="1.8"/>
            <rect x="135" y="645" width="28" height="30" fill="#f59e42" stroke="#332f2b" stroke-width="1.8"/>
            <rect x="167" y="645" width="28" height="30" fill="#f59e42" stroke="#332f2b" stroke-width="1.8"/>

            <!-- 攤位圖示 (乾糧包、罐頭、慢食碗) -->
            <g fill="#7c2d12" font-size="8" font-weight="900" text-anchor="middle">
              <text x="64" y="184">A01</text>
              <text x="64" y="232">A02</text>
              <text x="116" y="195">A01</text>
              <text x="170" y="195">A01</text>
              <text x="116" y="310">A01</text>
              <text x="170" y="310">A01</text>
              <text x="116" y="430">A01</text>
              <text x="170" y="430">A02</text>
              <text x="116" y="560">A01</text>
              <text x="170" y="560">A02</text>
            </g>

            <!-- 專區中英文標籤 -->
            <rect x="80" y="358" width="145" height="32" rx="6" fill="#ffffff" stroke="#f59e42" stroke-width="2"/>
            <text x="152" y="373" font-size="11" font-weight="900" fill="#9a3412" text-anchor="middle">寵物食品與餵食區</text>

          </g>

          <!-- ==================== 2. 美容與護理區 (水藍色 B05-B09, C01, C08, C11) ==================== -->
          <g id="zone-grooming" class="interactive-booth" data-id="grooming" filter="url(#booth-shadow)">
            <rect x="280" y="150" width="145" height="185" rx="8" fill="#e3f5f6" stroke="#6ec5cb" stroke-width="2.5"/>
            <!-- 攤位群 (第一排上) -->
            <rect x="285" y="160" width="30" height="40" fill="#6ec5cb" stroke="#332f2b" stroke-width="1.8"/>

            <rect x="335" y="160" width="30" height="40" fill="#6ec5cb" stroke="#332f2b" stroke-width="1.8"/>

            <!-- 攤位群 (第一排下) -->

            <rect x="285" y="321" width="30" height="40" fill="#6ec5cb" stroke="#332f2b" stroke-width="1.8"/>
            <rect x="335" y="275" width="30" height="40" fill="#6ec5cb" stroke="#332f2b" stroke-width="1.8"/>
            <rect x="335" y="321" width="30" height="40" fill="#6ec5cb" stroke="#332f2b" stroke-width="1.8"/>
            <rect x="380" y="275" width="35" height="40" fill="#6ec5cb" stroke="#332f2b" stroke-width="1.8"/>

            <!-- 攤位代號 -->

              <text x="300" y="185">B05</text>

            <!-- 專區中英文標籤 -->
            <rect x="285" y="248" width="135" height="24" rx="4" fill="#ffffff" stroke="#6ec5cb" stroke-width="1.5"/>

    // ==================== 頁面互動狀態管理 ====================

    // 更新右側面板詳細內容（照片留空預留位）
    function updateDrawerContent(data) {
      drawerTitle.innerText = data.name;
      drawerSubtitle.innerText = data.subName;
      drawerTag.innerText = data.badge;
      drawerBadgeIcon.className = `w-10 h-10 rounded-2xl flex items-center justify-center text-xl text-white font-bold shadow-xs ${data.colorClass}`;
      drawerBadgeIcon.innerHTML = `<i class="ph-bold ${data.icon}"></i>`;
      drawerWalkTime.innerText = data.walkTime;

      // 檢查是否有照片，無照片則顯示留空提示框
      if (data.photo && data.photo.trim() !== "") {
        drawerPhoto.src = data.photo;
        drawerPhoto.classList.remove("hidden");
        photoPlaceholderBox.classList.add("hidden");
      } else {
        drawerPhoto.src = "";
        drawerPhoto.classList.add("hidden");
        photoPlaceholderBox.classList.remove("hidden");
      }

      if (drawerPhotoCaption) {
        drawerPhotoCaption.innerText = data.photoCaption;
      }

      // 逐步步行引導步驟
      drawerSteps.innerHTML = "";
      data.steps.forEach(step => {
        const li = document.createElement("li");
        li.className = "flex items-start gap-1.5";
        li.innerHTML = `<i class="ph-fill ph-check-circle text-red-500 shrink-0 mt-0.5"></i> <span>${step}</span>`;
        drawerSteps.appendChild(li);
      });

      // 介紹簡述
      drawerDesc.innerText = data.desc;

      // 展出品項清單
      drawerItems.innerHTML = "";
      data.items.forEach(item => {
        const li = document.createElement("li");
        li.className = "flex items-center gap-1.5";
        li.innerHTML = `<i class="ph-bold ph-check text-amber-500 text-xs"></i> <span>${item}</span>`;
        drawerItems.appendChild(li);
      });

      // 毛孩叮嚀與攤位代碼
      drawerNote.innerText = data.note;
      drawerBoothCodes.innerText = data.boothCodes;
    }

    // 渲染側邊欄卡片清單 (左側縮圖改為圖標與留空提示)
    function renderSidebarList() {
      zoneCardList.innerHTML = "";
      const filtered = floorPlanData.filter(zone => {
        if (currentFilter === "all") return true;
        return zone.category === currentFilter;
      });

      filtered.forEach(zone => {
        const isSelected = zone.id === currentSelectedId;
        const card = document.createElement("div");
        card.className = `p-2.5 rounded-2xl border transition-all cursor-pointer relative ${
          isSelected 
            ? "bg-amber-50/90 border-amber-500 shadow-sm ring-2 ring-amber-500/20" 
            : "bg-white hover:bg-stone-50 border-stone-200"
        }`;
        card.dataset.id = zone.id;

        // 若有自訂照片則顯示照片，無照片則顯示該區主題代表圖標
        const thumbHtml = (zone.photo && zone.photo.trim() !== "")
          ? `<img src="${zone.photo}" alt="${zone.name}" class="w-full h-full object-cover">`
          : `<div class="w-full h-full flex flex-col items-center justify-center text-stone-400 bg-stone-100"><i class="ph-bold ${zone.icon} text-lg text-stone-500"></i><span class="text-[8px] text-stone-400">留空</span></div>`;

        card.innerHTML = `
          <div class="flex items-center gap-2.5">
            <div class="relative w-12 h-12 rounded-xl overflow-hidden shrink-0 border border-stone-200 bg-stone-100">
              ${thumbHtml}
              <div class="absolute bottom-0 right-0 w-4 h-4 rounded-tl-md flex items-center justify-center text-white ${zone.colorClass}">
                <i class="ph-bold ${zone.icon} text-[9px]"></i>
              </div>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-0.5">
                <span class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-stone-100 text-stone-600">${zone.badge}</span>
                <span class="text-[10px] text-red-600 font-bold flex items-center gap-0.5">
                  <i class="ph-bold ph-navigation-arrow"></i> ${zone.walkTime}
                </span>
              </div>
              <h3 class="text-xs font-bold text-stone-900 truncate">${zone.name}</h3>
              <p class="text-[10px] text-stone-500 truncate">${zone.boothCodes}</p>
            </div>
          </div>
        `;

        card.addEventListener("click", () => {
          selectZone(zone.id, true);
        });

        zoneCardList.appendChild(card);
      });
    }

    // 選擇特定展區（核心動線計算與視角聯動）
    function selectZone(zoneId, shouldFocus = true) {
      currentSelectedId = zoneId;
      const zoneData = floorPlanData.find(z => z.id === zoneId);
      if (!zoneData) return;

      // 1. 更新側邊欄清單狀態
      renderSidebarList();
      const activeCard = zoneCardList.querySelector(`[data-id="${zoneId}"]`);
      if (activeCard) {
        activeCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      // 2. 清除所有 SVG 高亮，並為當前選取展位附加脈衝光暈樣式
      document.querySelectorAll(".interactive-booth").forEach(el => {
        el.classList.remove("active-zone-glow");
      });
      const svgTarget = document.getElementById(`zone-${zoneId}`);
      if (svgTarget) {
        svgTarget.classList.add("active-zone-glow");
      }

      // 3. 繪製動態導航路徑（從入口出發的流光箭頭路線）
      activeNavPath.setAttribute("d", zoneData.navPath);
      endPin.setAttribute("cx", zoneData.targetPoint.x);
      endPin.setAttribute("cy", zoneData.targetPoint.y);
      endPin.classList.remove("hidden");

      // 4. 更新面板內容
      updateDrawerContent(zoneData);

      // 5. 響應式展示策略：桌面展開獨立欄位，手機預設為精簡底列（Peek Bar），絕不遮擋地圖
      if (window.innerWidth < 768) {
        // 手機版：更新底列並滑入
        mobilePeekTitle.innerText = zoneData.name;
        mobilePeekTime.innerHTML = `<i class="ph-bold ph-navigation-arrow"></i> ${zoneData.walkTime}`;
        mobilePeekBadge.className = `w-8 h-8 rounded-xl text-white flex items-center justify-center shrink-0 ${zoneData.colorClass}`;
        mobilePeekBadge.innerHTML = `<i class="ph-bold ${zoneData.icon}"></i>`;
        mobilePeekBar.classList.remove("translate-y-28");
        // 確保展開面板處於收合
        infoPanel.classList.add("translate-y-full");
      } else {
        // 桌面版：展開獨立資訊欄
        infoPanel.classList.remove("md:hidden");
      }

      // 6. 是否自動平移置中地圖
      if (shouldFocus) {
        focusOnCoords(zoneData.targetPoint.x, zoneData.targetPoint.y);
      }
    }

    // 關閉右側面板
    function closeInfoPanel() {
      if (window.innerWidth < 768) {
        infoPanel.classList.add("translate-y-full");
      } else {
        infoPanel.classList.add("md:hidden");
      }
    }

    // 平移聚焦至座標（保證目標展位位於地圖區域正中央）
    function focusOnCoords(x, y) {
      scale = 1.25;
      // 展場中心為 (550, 390)
      const dx = (550 - x) * 0.45;
      const dy = (390 - y) * 0.45;
      mapPanZoom.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    }

    // 重設地圖視角
    function resetView() {
      scale = 1;
      mapPanZoom.style.transform = `translate(0px, 0px) scale(1)`;
    }

    // 清除當前導航動線
    function clearNavigation() {
      currentSelectedId = null;
      activeNavPath.setAttribute("d", "");
      endPin.classList.add("hidden");
      document.querySelectorAll(".interactive-booth").forEach(el => {
        el.classList.remove("active-zone-glow");
      });
      renderSidebarList();
      closeInfoPanel();
      mobilePeekBar.classList.add("translate-y-28");
      resetView();
    }

    // 專注全地圖模式切換（收合/展開側邊欄，釋放 100% 地圖視野）
    function toggleFocusMode() {
      isFocusMode = !isFocusMode;
      if (isFocusMode) {
        sidebar.classList.add("hidden");
        infoPanel.classList.add("hidden");
        mobilePeekBar.classList.add("translate-y-28");
        focusModeText.innerText = "退出全景";
        focusModeIcon.className = "ph-bold ph-arrows-in text-amber-600";
        focusModeBtn.classList.add("bg-amber-50", "border-amber-300");
      } else {
        sidebar.classList.remove("hidden");
        if (currentSelectedId) {
          infoPanel.classList.remove("hidden");
        }
        focusModeText.innerText = "全地圖模式";
        focusModeIcon.className = "ph-bold ph-eye text-stone-700";
        focusModeBtn.classList.remove("bg-amber-50", "border-amber-300");
      }
    }

    // 初始化所有事件監聽器
    function initListeners() {
      // 地圖與圖例攤位點擊事件綁定
      document.querySelectorAll(".interactive-booth").forEach(booth => {
        booth.addEventListener("click", () => {
          const zoneId = booth.dataset.id;
          if (zoneId) {
            selectZone(zoneId, true);
          }
        });
      });

      // 點擊留空照片框可直接選擇本機照片上傳預覽
      drawerPhotoContainer.addEventListener("click", () => {
        photoFileInput.click();
      });

      photoFileInput.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file && currentSelectedId) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const dataUrl = event.target.result;
            const currentZone = floorPlanData.find(z => z.id === currentSelectedId);
            if (currentZone) {
              currentZone.photo = dataUrl;
              updateDrawerContent(currentZone);
              renderSidebarList();
            }
          };
          reader.readAsDataURL(file);
        }
      });

      // 關閉資訊面板
      closePanelBtn.addEventListener("click", closeInfoPanel);

      // 手機端底列展開至完整抽屜
      mobileExpandBtn.addEventListener("click", () => {
        infoPanel.classList.remove("translate-y-full");
      });
      bottomSheetHandle.addEventListener("click", () => {
        infoPanel.classList.add("translate-y-full");
      });

      // 專注全地圖模式按鈕
      focusModeBtn.addEventListener("click", toggleFocusMode);

      // 手機端切換左側選單
      toggleSidebarBtn.addEventListener("click", () => {
        sidebar.classList.toggle("hidden");
      });

      // 抽屜內「重置置中」按鈕
      focusZoneBtn.addEventListener("click", () => {
        if (currentSelectedId) {
          const z = floorPlanData.find(item => item.id === currentSelectedId);
          if (z) focusOnCoords(z.targetPoint.x, z.targetPoint.y);
        }
      });

      // 快捷分類篩選
      zoneQuickFilter.addEventListener("click", (e) => {
        const btn = e.target.closest(".quick-filter-btn");
        if (!btn) return;
        document.querySelectorAll(".quick-filter-btn").forEach(b => {
          b.classList.remove("bg-stone-800", "text-white");
          b.classList.add("bg-stone-100", "text-stone-700");
        });
        btn.classList.add("bg-stone-800", "text-white");
        btn.classList.remove("bg-stone-100", "text-stone-700");

        currentFilter = btn.dataset.cat;
        renderSidebarList();
      });

      // 全場建議推薦動線切換
      toggleTourBtn.addEventListener("click", () => {
        isTourActive = !isTourActive;
        tourGuideLayer.classList.toggle("opacity-0", !isTourActive);
        tourDot.className = `w-2 h-2 rounded-full ${isTourActive ? "bg-amber-500 animate-pulse" : "bg-stone-300"}`;
      });

      // 清除動線按鈕
      clearRouteBtn.addEventListener("click", clearNavigation);

      // 縮放按鈕
      zoomInBtn.addEventListener("click", () => {
        scale = Math.min(scale + 0.2, 2.2);
        mapPanZoom.style.transform = `scale(${scale})`;
      });

      zoomOutBtn.addEventListener("click", () => {
        scale = Math.max(scale - 0.2, 0.75);
        mapPanZoom.style.transform = `scale(${scale})`;
      });

      zoomResetBtn.addEventListener("click", resetView);
    }

    // 網頁載入完成初始化
    window.addEventListener("DOMContentLoaded", () => {
      renderSidebarList();
      initListeners();

      // 預設選取「寵物食品與餵食區」，展示從入口出發的導航動線
      setTimeout(() => {
        selectZone("food", false);
      }, 350);
    });
  </script>
</body>
</html>
